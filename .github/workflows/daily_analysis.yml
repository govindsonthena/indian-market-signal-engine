name: Daily Analysis

on:
  schedule:
    # Run at 4:30 PM IST (11:00 AM UTC) Monday-Friday
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        run: |
          python src/main.py

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/latest.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/latest.json
          git commit -m "Daily analysis update - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Report Summary
        if: always()
        run: |
          echo "Analysis completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

# Note: Phase 9 will implement the complete workflow
# This template includes the basic structure for scheduling and automation
